name: Build canonical PDFs

on:
  push:
    branches: [main]
    paths:
      - "canon/volumes/**"
      - "scripts/build_canon_pdfs.py"
      - ".github/workflows/build-canon-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: pip install reportlab
      - name: Build master canon and PDFs
        run: python scripts/build_canon_pdfs.py
      - name: Commit generated canon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canon/BIBLIA_MESTRE.md canon/pdfs/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build canonical PDFs [skip ci]"
            git push
          fi
